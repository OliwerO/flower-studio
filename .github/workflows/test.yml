name: Test

# Runs on every pull request + every push to master.
# Seven jobs:
#   - lint:        static guards (backend silent-catch ban, root pitfall #5).
#   - unit:        backend vitest, everything except *.integration.test.js.
#   - integration: backend vitest, only *.integration.test.js (pglite-backed).
#   - shared:      packages/shared vitest (utils, hooks, components).
#   - e2e:         boots the local-PG harness and runs scripts/e2e-test.js end-to-end.
#   - ui:          Playwright drives the real React apps against that harness (#612).
#   - lab-api:     lab factories + API integration gate against a real Postgres.
#
# Together these are CLAUDE.md's Pre-PR matrix. `ui` is item 4b, and it was the
# one item nothing enforced until #612 — a UI spec could rot for weeks and no
# PR check would notice. It exists because component tests and integration
# tests both pass while the wiring between them is broken.
#
# unit + integration are two halves of one suite — see the note on the `unit`
# job for how the split is expressed and why it can't silently drop a file.
#
# Every job that needs deps installs them from the root via `npm ci`
# (workspace layout) so every workspace package is hoisted once. Backend
# devDeps include @electric-sql/pglite (the harness's in-process Postgres) —
# no Docker, no external services, no secrets needed.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
# Saves CI minutes during rapid iteration on a PR.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static guards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      # Backend silent-catch guard. CLAUDE.md (root pitfall #5) bans
      # `.catch(() => {})` because it swallows cascade and audit failures.
      # Routes/services/repos/db must surface errors via console.error or
      # by re-throwing. If a backend silent catch sneaks back in, fail CI.
      #
      # Tests + frontends are excluded:
      #  - tests use it intentionally for negative assertions
      #  - frontend side-loads fall back to defaults on failure (each is a
      #    judgment call; reviewed PR-by-PR rather than CI-blocked)
      - name: Reject silent .catch in backend
        run: |
          MATCHES=$(grep -rEn '\.catch\(\s*\(\)\s*=>\s*\{\s*\}\s*\)|\.catch\(\s*\([a-zA-Z_]+\)\s*=>\s*\{\s*\}\s*\)|\.catch\(\s*[a-zA-Z_]+\s*=>\s*\{\s*\}\s*\)' \
            --include='*.js' backend/src \
            | grep -v __tests__ \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Silent .catch(() => {}) found in backend. Replace with .catch(err => console.error('[CONTEXT]', err.message)) — see CLAUDE.md pitfall #5."
            echo "$MATCHES"
            exit 1
          fi

  # The backend suite runs as two jobs so a slow half can't drag the other
  # half's feedback with it. The two filters are exact complements:
  #
  #   unit         --exclude '**/*.integration.test.js'   (a GLOB)
  #   integration  integration.test.js                    (a path SUBSTRING)
  #
  # Those are different kinds of argument and are not interchangeable.
  # Vitest's positional filters are substring matches on the file path, NOT
  # globs — `vitest run '**/*.integration.test.js'` matches ZERO files and
  # exits 0, which would look like a green job that silently tested nothing.
  # Verified against the version this repo actually installs: backend pins
  # vitest 4.1.0 in its own node_modules (the root hoists 3.2.4 for
  # packages/shared), and `working-directory: backend` picks up the v4 binary.
  #
  # If you touch either filter, prove the halves still partition the whole —
  # unit + integration must equal total, with nothing counted twice:
  #   cd backend
  #   npx vitest list --filesOnly | wc -l                                  # total
  #   npx vitest list --filesOnly --exclude '**/*.integration.test.js' | wc -l
  #   npx vitest list --filesOnly integration.test.js | wc -l
  # and check the two jobs' "Tests N passed" lines sum to what `npx vitest
  # run` reports on its own.
  unit:
    name: Backend tests — unit
    runs-on: ubuntu-latest
    # 10 → 20 on 2026-07-26 (#586, stopgap after run 30200748052 killed a
    # green 1085-test suite 0.07s after its summary), then back to 10 the
    # same day once the actual cause was fixed. It was never the migration
    # replay: the pglite harness booted a fresh WASM Postgres (~562ms) per
    # TEST, and that boot — not the ~44ms of migrations — was the runtime.
    # The harness is now pooled per file (backend/src/__tests__/helpers/
    # pgHarness.js), which took the suite from ~590s to ~110s. The ceiling is
    # back to killing hangs rather than bounding normal growth; if it trips
    # again, look for a leaked per-test boot before raising the number.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npx vitest run --exclude '**/*.integration.test.js'
        working-directory: backend
        env:
          # Vitest tests don't need real Airtable — services are mocked.
          # Setting these to dummy values just satisfies the env-var validator
          # in backend/src/index.js when any test imports it transitively.
          AIRTABLE_API_KEY: test-mock-key
          AIRTABLE_BASE_ID: appMockBase
          PIN_OWNER: '1111'
          PIN_FLORIST: '2222'

  integration:
    name: Backend tests — integration
    runs-on: ubuntu-latest
    # See the timeout note on `unit` above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Positional arg = substring match on the file path (see the note on
      # `unit`). This is the complement of that job's --exclude glob.
      - name: Run backend integration tests
        run: npx vitest run integration.test.js
        working-directory: backend
        env:
          AIRTABLE_API_KEY: test-mock-key
          AIRTABLE_BASE_ID: appMockBase
          PIN_OWNER: '1111'
          PIN_FLORIST: '2222'

  shared:
    name: Shared unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run shared tests (utils, hooks, components)
        run: npx vitest run
        working-directory: packages/shared

  e2e:
    name: E2E harness suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Boot test harness in background
        # The harness writes its own banner + auto-seeds via POST /api/test/reset
        # once the listener is up. We wait for the health endpoint before kicking
        # off the test suite.
        # HARNESS_MOCK_WIX=1 enables the Wix Media + Stores fetch interceptor
        # so the bouquet-image-upload E2E section (S25) doesn't need real Wix
        # credentials. See backend/scripts/start-test-backend.js.
        run: npm run harness &
        env:
          # Suppress colour escapes in CI logs.
          NO_COLOR: '1'
          HARNESS_MOCK_WIX: '1'

      - name: Wait for harness to be ready
        # Poll /api/health for up to ~30s. Fail the job if the harness never
        # comes up — better a clear timeout than a confusing test-suite error.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/api/health > /dev/null; then
              echo "Harness up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Harness did not come up within 30s."
          exit 1

      - name: Run E2E suite
        run: npm run test:e2e

  ui:
    name: UI click-through (Playwright)
    runs-on: ubuntu-latest
    # Cold start dominates: pglite boots an in-process Postgres and replays
    # every migration, then three Vite dev servers come up. The specs
    # themselves run in well under a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Chromium only — playwright.config.js defines a single `chromium`
      # project. `--with-deps` pulls the system libraries the headless browser
      # needs on a bare ubuntu runner.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # No harness boot step here: playwright.config.js owns its own
      # `webServer` block (backend on :3002 + florist/delivery/dashboard Vite
      # servers) and `reuseExistingServer: !process.env.CI` makes it always
      # start fresh on CI. That is also why this cannot collide with the
      # `e2e` job's harness — separate jobs, separate runners.
      - name: Run UI suite
        run: npm run test:ui

      # The whole point of this job is that a broken spec must not be able to
      # rot unnoticed (#612), so a failure has to be diagnosable from the PR
      # without re-running anything locally. `trace: 'on-first-retry'` +
      # `video: 'retain-on-failure'` are already configured; this is what
      # carries them out of the runner.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lab-api:
    name: Lab harness — API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install lab deps
        run: cd lab && npm install --no-audit --no-fund

      - name: Apply migrations to lab DB
        run: npm run lab:migrate

      - name: Run lab unit tests (factories + scenarios)
        run: npm run lab:test:unit

      - name: Build template DB with baseline
        run: npm run lab:template:rebuild -- --scenario=baseline

      - name: Run lab API integration tests
        run: npm run lab:test:api
        env:
          LAB_API_URL: http://localhost:3003
